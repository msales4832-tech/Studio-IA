<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Modak;src:url(Modak-Regular.ttf)}
body{margin:0;background:#f3e3cc;font-family:Georgia,serif}
.card{width:1100px;padding:30px 30px 20px;box-sizing:border-box}
h1{font:400 44px Modak;color:#c8102e;margin:0;line-height:1}
p.sub{margin:4px 0 10px;color:#333;font-size:18px}
.row{display:flex;gap:20px}
.lbl{text-align:center;font:bold 18px Georgia;color:#555;letter-spacing:2px}
.b{font-family:Modak;paint-order:stroke;stroke-linejoin:round}
</style></head><body><div class="card" id="c"></div>
<script>
const V = new URLSearchParams(location.search).get('v') || '1';
const RED='#c8102e', DRK='#7a0a1c', NAVY='#1d3557';
const body='M190,40 Q250,58 310,40 L400,70 L480,180 L425,215 L385,175 L380,530 Q250,540 120,530 L115,175 L75,215 L20,180 L100,70 Z';
function shirt(id, front, art){
  const dir=[0.59,-0.81], hem=[[20,180],[75,215]], hemR=[[480,180],[425,215]];
  const stripes=(h,sx)=>[14,34].map(o=>{const dx=dir[0]*sx*o,dy=dir[1]*o,a=[h[0][0]+dx,h[0][1]+dy],b=[h[1][0]+dx,h[1][1]+dy],ex=(b[0]-a[0]),ey=(b[1]-a[1]);
    return `<line x1="${a[0]-ex*.3}" y1="${a[1]-ey*.3}" x2="${b[0]+ex*.12}" y2="${b[1]+ey*.12}" stroke="${RED}" stroke-width="10"/>`;}).join('');
  const neck = front
    ? `<path d="M190,40 L250,112 L310,40" fill="#fff" stroke="${RED}" stroke-width="12" stroke-linejoin="round"/><path d="M200,42 L250,100 L300,42 Z" fill="#e9e9e9"/>`
    : `<path d="M190,40 Q250,58 310,40" fill="none" stroke="${RED}" stroke-width="10"/>`;
  return `<svg width="510" height="560" viewBox="0 0 500 550">
  <defs><clipPath id="k${id}"><path d="${body}"/></clipPath>
  <filter id="sh${id}"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".18"/></filter></defs>
  <path d="${body}" fill="#fbfbfb" stroke="#ccc" stroke-width="2" filter="url(#sh${id})"/>
  <g clip-path="url(#k${id})">${stripes(hem,1)}${stripes(hemR,-1)}</g>
  <path d="M115,175 L100,70 M385,175 L400,70" stroke="#ddd" stroke-width="2" fill="none"/>
  ${neck}<g clip-path="url(#k${id})">${art}</g></svg>`;
}
const T=(x,y,s,txt,fill,extra='',w=240)=>`<text class="b" data-w="${w}" x="${x}" y="${y}" font-size="${s}" text-anchor="middle" fill="${fill}" stroke="${DRK}" stroke-width="${s/14}" ${extra}>${txt}</text>`;
const verso=(y)=>`<text x="250" y="${y}" font-size="13.5" text-anchor="middle" font-style="italic" fill="#333">“Lâmpada para os meus pés é a tua palavra,</text>
 <text x="250" y="${y+18}" font-size="13.5" text-anchor="middle" font-style="italic" fill="#333">e luz para o meu caminho.”</text>
 <text x="250" y="${y+38}" font-size="11" text-anchor="middle" fill="#333" letter-spacing="2">SALMOS 119:105</text>`;
const lamp=(x,y,s,c=RED)=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M-30,6 Q-30,-14 0,-14 Q22,-14 30,-4 L44,-12 L40,4 Q30,16 0,16 Q-30,16 -30,6Z" fill="${c}"/><path d="M-6,-14 Q0,-34 6,-14" fill="#f4a300"/><path d="M-26,0 L-40,-6 Q-44,6 -30,8" fill="none" stroke="${c}" stroke-width="5"/></g>`;
const D={
'1':{t:'Variação 1 — “Versículo dividido”',s:'Frente: “Lâmpada para os meus pés”. Costas: “e luz para o meu caminho”. Quando o grupo gira, o público lê o versículo inteiro.',
 f:T(250,225,92,'LÂMPADA',RED,'transform="rotate(-3 250 210)"')+T(250,265,40,'PARA OS MEUS',NAVY,'stroke="#0b1d33"')+T(250,345,96,'PÉS',RED,'transform="rotate(2 250 320)"')+lamp(250,400,1.1),
 c:T(250,180,40,'E',NAVY,'stroke="#0b1d33"')+T(250,300,140,'LUZ',RED,'transform="rotate(-2 250 260)"')+T(250,345,40,'PARA O MEU',NAVY,'stroke="#0b1d33"')+T(250,410,72,'CAMINHO',RED)+`<text x="250" y="450" font-size="11" text-anchor="middle" fill="#333" letter-spacing="2">SALMOS 119:105</text>`},
'2':{t:'Variação 2 — “Igual à camisa preta” (nas costas)',s:'Frente limpa: só a lâmpada pequena no peito. Costas: letras gordinhas sobrepostas + o versículo inteiro embaixo, como na camisa Dance for Jesus.',
 f:lamp(318,140,.75)+`<text class="b" x="318" y="182" font-size="18" text-anchor="middle" fill="${RED}">SL 119:105</text>`,
 c:T(250,215,86,'LÂMPADA',RED,'transform="rotate(-4 250 200)"')+T(250,250,46,'PARA',NAVY,'stroke="#0b1d33" transform="rotate(-6 250 240)"')+T(250,312,92,'MEUS PÉS',RED,'transform="rotate(2 250 310)"')+verso(365)},
'3':{t:'Variação 3 — “Uniforme de time” (número 119)',s:'Frente: lâmpada pequena no peito. Costas: frase em arco, número 119 grande como camisa de time, e o resto do versículo embaixo.',
 f:lamp(182,140,.75)+`<text class="b" x="182" y="182" font-size="18" text-anchor="middle" fill="${RED}">SL 119:105</text>`,
 c:`<defs><path id="arc" d="M110,215 Q250,120 390,215"/></defs><text class="b" data-w="250" font-size="38" fill="${RED}" stroke="${DRK}" stroke-width="2.6"><textPath href="#arc" startOffset="50%" text-anchor="middle">LÂMPADA PARA OS MEUS PÉS</textPath></text>`+T(250,370,190,'119',RED,'letter-spacing="-6"')+T(250,415,34,'E LUZ PARA O MEU CAMINHO',NAVY,'stroke="#0b1d33"')+`<text x="250" y="445" font-size="11" text-anchor="middle" fill="#333" letter-spacing="2">SALMOS 119:105</text>`}
}[V];
document.getElementById('c').innerHTML=`<h1>${D.t}</h1><p class="sub">${D.s}</p>
<div class="row"><div>${shirt('a',true,D.f)}<div class="lbl">FRENTE</div></div><div>${shirt('b',false,D.c)}<div class="lbl">COSTAS</div></div></div>`;
// encolhe cada texto até caber na área de impressão (data-w)
document.fonts.ready.then(()=>{document.querySelectorAll('text[data-w]').forEach(t=>{
  const w=+t.dataset.w, L=t.getComputedTextLength(), fs=+t.getAttribute('font-size');
  if(L>w){const n=fs*w/L;t.setAttribute('font-size',n);t.setAttribute('stroke-width',n/14);}
});document.body.dataset.ok=1;});
</script></body></html>
